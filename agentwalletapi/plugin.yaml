name: agentwalletapi
version: 1.28.0
description: OpenClawCash managed EVM and Solana wallets for AI agents. Thin bridge to the OpenClawCash agent API (https://openclawcash.com/api/agent/*) — the same API the OpenClawCash MCP server and CLI use.
license: MIT
requires_env:
  - OPENCLAWCASH_AGENT_KEY
provides_tools:
  - agentwalletapi_wallets_list
  - agentwalletapi_wallet_get
  - agentwalletapi_wallet_rename
  - agentwalletapi_wallet_create
  - agentwalletapi_wallet_import
  - agentwalletapi_transfer_send
